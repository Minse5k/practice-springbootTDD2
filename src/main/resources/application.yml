spring:
  application:
    name: back
  profiles:
    active: dev # 아무 설정 없이 실행하면 dev 프로필로 동작
  output:
    ansi:
      enabled: always # 콘솔 로그에 색상 표시
  datasource:
    # 개발용 DB: 프로젝트 루트에 db_dev.mv.db 파일로 저장된다 (서버를 껐다 켜도 데이터 유지)
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 에서 DB 내용을 눈으로 확인
  jpa:
    hibernate:
      ddl-auto: update # 엔티티 클래스를 보고 테이블을 자동 생성/수정
    properties:
      hibernate:
        format_sql: true # 실행되는 SQL을 보기 좋게 줄바꿈
        highlight_sql: true
        use_sql_comments: true
logging:
  level:
    com.back: DEBUG
    org.hibernate.SQL: DEBUG # 실행되는 SQL 출력
    org.hibernate.orm.jdbc.bind: TRACE # SQL의 ? 에 바인딩되는 실제 값 출력
