<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#222">JPA 쓰기 지연 : SQL 은 "나중에(flush 시점)" DB 로 간다</text>

  <!-- 022 -->
  <text x="30" y="80" font-size="16" font-weight="700" fill="#d93025">022 · 댓글 달린 글 삭제</text>
  <line x1="40" y1="130" x2="920" y2="130" stroke="#999" stroke-width="2" marker-end="url(#ah)"/>
  <text x="920" y="182" text-anchor="end" font-size="11" fill="#999">시간 →</text>
  <g font-size="13">
    <rect x="50" y="95" width="160" height="70" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
    <text x="130" y="122" text-anchor="middle">postRepository</text>
    <text x="130" y="140" text-anchor="middle">.delete(post)</text>
    <text x="130" y="157" text-anchor="middle" font-size="11" fill="#777">DELETE 를 모아둠</text>
    <rect x="250" y="95" width="200" height="70" rx="8" fill="#e3f4e1" stroke="#1e8e3e"/>
    <text x="350" y="122" text-anchor="middle">응답 200</text>
    <text x="350" y="140" text-anchor="middle">"1번 글이 삭제되었습니다."</text>
    <text x="350" y="157" text-anchor="middle" font-size="11" fill="#777">아직 SQL 안 나감!</text>
    <rect x="490" y="95" width="190" height="70" rx="8" fill="#fef7e0" stroke="#f29900"/>
    <text x="585" y="122" text-anchor="middle">테스트의 count()</text>
    <text x="585" y="140" text-anchor="middle">→ 자동 flush</text>
    <text x="585" y="157" text-anchor="middle" font-size="11" fill="#777">DELETE 실행</text>
    <rect x="720" y="95" width="190" height="70" rx="8" fill="#fde2e2" stroke="#d93025"/>
    <text x="815" y="122" text-anchor="middle" font-weight="700" fill="#d93025">💥 FK 위반</text>
    <text x="815" y="140" text-anchor="middle">댓글이 post_id=1</text>
    <text x="815" y="157" text-anchor="middle">을 참조 중</text>
  </g>
  <text x="40" y="198" font-size="13" fill="#333">해결(023) : <tspan font-weight="700">cascade = REMOVE</tspan> → 댓글 DELETE 3번 → 글 DELETE 순서로 JPA 가 실행</text>

  <!-- 030 -->
  <text x="30" y="258" font-size="16" font-weight="700" fill="#d93025">030 · 댓글 작성 (cascade PERSIST)</text>
  <line x1="40" y1="308" x2="920" y2="308" stroke="#999" stroke-width="2" marker-end="url(#ah)"/>
  <g font-size="13">
    <rect x="50" y="273" width="160" height="70" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
    <text x="130" y="300" text-anchor="middle">post.addComment()</text>
    <text x="130" y="318" text-anchor="middle">목록에 add 만</text>
    <text x="130" y="335" text-anchor="middle" font-size="11" fill="#777">INSERT 를 모아둠</text>
    <rect x="250" y="273" width="200" height="70" rx="8" fill="#fde2e2" stroke="#d93025"/>
    <text x="350" y="300" text-anchor="middle" font-weight="700" fill="#d93025">응답 생성</text>
    <text x="350" y="318" text-anchor="middle">id = 0, createDate = null</text>
    <text x="350" y="335" text-anchor="middle" font-size="11" fill="#777">"0번 댓글이 작성되었습니다."</text>
    <rect x="490" y="273" width="190" height="70" rx="8" fill="#fef7e0" stroke="#f29900"/>
    <text x="585" y="300" text-anchor="middle">트랜잭션 끝 / flush</text>
    <text x="585" y="318" text-anchor="middle">→ INSERT 실행</text>
    <text x="585" y="335" text-anchor="middle" font-size="11" fill="#777">이제야 id = 6</text>
  </g>
  <rect x="40" y="365" width="880" height="80" rx="8" fill="#e3f4e1" stroke="#1e8e3e"/>
  <text x="60" y="392" font-size="14" fill="#333">해결(031) : addComment() 직후 <tspan font-weight="700">postRepository.flush()</tspan> → INSERT 를 즉시 실행 → id 와 날짜가 채워진 채로 응답</text>
  <text x="60" y="420" font-size="14" fill="#333">⚠️ flush 는 SQL 을 DB 로 "보내기만" 할 뿐 커밋이 아니다. 커밋은 @Transactional 메서드가 끝날 때.</text>
</svg>
