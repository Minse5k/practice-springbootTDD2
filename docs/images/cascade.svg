<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="920" height="330" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#222">cascade 옵션과 orphanRemoval 비교</text>

  <!-- PERSIST -->
  <rect x="20" y="60" width="280" height="250" rx="12" fill="#e3f4e1" stroke="#1e8e3e" stroke-width="2"/>
  <text x="160" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#1e8e3e">cascade = PERSIST</text>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#555">030~031 댓글 작성</text>
  <rect x="60" y="130" width="200" height="40" rx="6" fill="#fff" stroke="#1e8e3e"/>
  <text x="160" y="155" text-anchor="middle" font-size="14">post.addComment("…")</text>
  <text x="160" y="195" text-anchor="middle" font-size="22">⬇</text>
  <text x="160" y="228" text-anchor="middle" font-size="14">목록에 추가된 새 댓글을</text>
  <text x="160" y="250" text-anchor="middle" font-size="14" font-weight="700">INSERT</text>
  <text x="160" y="285" text-anchor="middle" font-size="12" fill="#555">글 저장이 댓글로 "전파"</text>

  <!-- REMOVE -->
  <rect x="320" y="60" width="280" height="250" rx="12" fill="#fde2e2" stroke="#d93025" stroke-width="2"/>
  <text x="460" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#d93025">cascade = REMOVE</text>
  <text x="460" y="112" text-anchor="middle" font-size="12" fill="#555">023 글 삭제</text>
  <rect x="360" y="130" width="200" height="40" rx="6" fill="#fff" stroke="#d93025"/>
  <text x="460" y="155" text-anchor="middle" font-size="14">postRepository.delete(post)</text>
  <text x="460" y="195" text-anchor="middle" font-size="22">⬇</text>
  <text x="460" y="228" text-anchor="middle" font-size="14">부모(글)가 삭제되면</text>
  <text x="460" y="250" text-anchor="middle" font-size="14">자식(댓글) <tspan font-weight="700">전부 DELETE</tspan></text>
  <text x="460" y="285" text-anchor="middle" font-size="12" fill="#555">글 삭제가 댓글로 "전파"</text>

  <!-- orphanRemoval -->
  <rect x="620" y="60" width="280" height="250" rx="12" fill="#e1ecfb" stroke="#1a73e8" stroke-width="2"/>
  <text x="760" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#1a73e8">orphanRemoval = true</text>
  <text x="760" y="112" text-anchor="middle" font-size="12" fill="#555">035 댓글 삭제</text>
  <rect x="660" y="130" width="200" height="40" rx="6" fill="#fff" stroke="#1a73e8"/>
  <text x="760" y="155" text-anchor="middle" font-size="14">post.deleteComment(c)</text>
  <text x="760" y="195" text-anchor="middle" font-size="22">⬇</text>
  <text x="760" y="228" text-anchor="middle" font-size="14">목록에서 빠진 자식(고아)을</text>
  <text x="760" y="250" text-anchor="middle" font-size="14" font-weight="700">DELETE</text>
  <text x="760" y="285" text-anchor="middle" font-size="12" fill="#555">부모는 그대로, 관계만 끊김</text>
</svg>
